AWSTemplateFormatVersion: '2010-09-09'
Description: CodeLab optional cloud progress store - no public table access
Parameters:
  TableName:
    Type: String
    Default: zamcan-codelab-progress
Resources:
  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: application
          Value: zamcan-codelab
Outputs:
  ProgressTableName:
    Value: !Ref ProgressTable
  ProgressTableArn:
    Value: !GetAtt ProgressTable.Arn
