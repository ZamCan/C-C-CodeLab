name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Manual Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          if bash gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug 2>&1 | tee android-build.log; then
            exit 0
          fi
          # A restored Gradle cache can remember a module lookup that predates a new test
          # dependency. Retry once with refreshed metadata; genuine build or test failures
          # still fail this step because the retry uses the same tasks.
          echo 'Retrying once with refreshed dependency metadata' | tee -a android-build.log
          bash gradlew --no-daemon --refresh-dependencies --stacktrace --console=plain testDebugUnitTest assembleDebug 2>&1 | tee -a android-build.log
      - name: Verify installed compiler asset names and bytes
        run: python3 tools/verify_toolchain.py --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Android lint
        if: success()
        run: |
          set -o pipefail
          bash gradlew --no-daemon --stacktrace --console=plain lintDebug 2>&1 | tee android-lint.log
      - name: Upload debug APK even if lint fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codelab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload Android diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            android-build.log
            android-lint.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
  device-compiler:
    name: Offline C and C++ on Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and instrumentation APKs
        run: bash gradlew --console=plain assembleDebug assembleDebugAndroidTest
      - name: Run the installed compiler without connectivity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell cmd connectivity airplane-mode enable
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
            bash gradlew --console=plain connectedDebugAndroidTest
            adb pull /sdcard/Pictures/CodeLabTest ui-smoke
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-compiler-test
          path: |
            ui-smoke/*.png
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
  lessons:
    name: Host C/C++ lesson and project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check source lessons compile
        run: python3 tools/verify_lessons.py
      - name: Check guided projects compile and behave
        run: python3 tools/verify_projects.py
      - name: Compile and run every authored lesson example
        run: python3 tools/verify_curriculum_examples.py
  backend:
    name: Backend policy and schema checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned backend dependencies
        run: npm ci --prefix backend
      - name: Build certification dashboard
        run: npm run build --prefix backend
      - name: Check all backend JavaScript syntax
        run: |
          find backend/src backend/frontend backend/test -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
      - name: Check exam policy and security regressions
        run: node --test backend/test/*.test.mjs
      - name: Apply migrations with local D1 runtime
        working-directory: backend
        run: npx wrangler d1 migrations apply zamcan-codelab-certification --local
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Check D1-compatible schema
        run: python3 tools/test_backend_schema.py
